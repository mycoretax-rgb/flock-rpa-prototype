const rp = (n) => 'Rp ' + Math.round(n).toLocaleString('id-ID');

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function switchRole(r) {
  state.role = r;
  state.pin = '';
  document.getElementById('roleJump').value = r;
  if (r === 'owner') state.tab = 'home';
  if (r === 'admin') state.tab = 'pt';
  if (r === 'lapak') state.tab = 'lapak';
  render();
}

function saveHargaBeliPt() {
  const fHarga = Number(document.getElementById('inFusoKeu').value || 0);
  const lHarga = Number(document.getElementById('inL300Keu').value || 0);
  state.ptModalFuso = fHarga;
  state.ptModalL300 = lHarga;
  const tot = Math.round((state.ptKgFuso * fHarga) + (state.ptKgL300 * lHarga));
  const existing = state.ptPurchaseHistory.find(p => p.tgl === state.ptBeliTanggal);
  if (existing) {
    existing.fusoHarga = fHarga;
    existing.l300Harga = lHarga;
    existing.total = tot;
  } else {
    state.ptPurchaseHistory.unshift({
      tgl: state.ptBeliTanggal,
      fusoKg: state.ptKgFuso,
      fusoHarga: fHarga,
      l300Kg: state.ptKgL300,
      l300Harga: lHarga,
      total: tot,
      sudahBayar: 0,
      bayarInput: tot,
      lunas: false
    });
  }
  toast('✓ Pembelian tgl ' + state.ptBeliTanggal + ' (' + rp(tot) + ') tersimpan!');
  render();
}

function bayarSupplier(idx) {
  const ph = state.ptPurchaseHistory[idx];
  const nominal = Number(ph.bayarInput || 0);
  if (!nominal) { toast('Isi nominal bayar supplier dulu!'); return; }
  ph.sudahBayar = Number(ph.sudahBayar || 0) + nominal;
  const sisa = Math.max(0, ph.total - ph.sudahBayar);
  ph.bayarInput = sisa;
  if (sisa === 0) {
    ph.lunas = true;

function savePartingCart(arah = 'masuk') {
  if (!state.partingCart.length) { toast('List barang masih kosong!'); return; }
  const now = new Date();
  const jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  for (const pt of state.partingCart) {
    const existing = state.freezerStock.find(x => x.item === pt.item);
    if (arah === 'masuk') {
      if (existing) {
        existing.kantong += pt.ktg;
        existing.kgSistem = Number((existing.kgSistem + pt.kg).toFixed(1));
        existing.kgAktual = existing.kgSistem;
      } else {
        state.freezerStock.unshift({ item: pt.item, kantong: pt.ktg, kgSistem: pt.kg, kgAktual: pt.kg, umur: 'Hari ini' });
      }
    } else {
      if (existing) {
        existing.kantong = Math.max(0, existing.kantong - pt.ktg);
        existing.kgSistem = Math.max(0, Number((existing.kgSistem - pt.kg).toFixed(1)));
        existing.kgAktual = existing.kgSistem;
      }
    }
    state.partingTodayLog.unshift({ item: pt.item, ktg: pt.ktg, kg: pt.kg, jam, arah });

function checkoutPos(mode) {
  if (!state.lapakCart.length) { toast('Struk masih kosong!'); return; }
  const grandTotal = state.lapakCart.reduce((s, it) => s + it.total, 0);
  const detail = state.lapakCart.map(it => it.barang.split(' ')[0] + ' ' + it.qty + it.satuan).join(', ');
  const now = new Date();
  const jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  const nama = (state.lapakBorrowerName || '').trim() || (mode === 'Lunas' ? 'Pembeli Biasa' : 'Pelanggan Lapak');

  state.lapakHistory.unshift({ jam, nama, detail, total: mode === 'Nyenteng' ? 0 : grandTotal, status: mode });

  if (mode === 'Lunas') {
    state.uangMasukPelunasan += grandTotal;
    toast('✓ Struk Lunas ' + rp(grandTotal) + ' masuk kas!');
  } else {
    const existing = state.nyentengList.find(x => x.nama.toLowerCase() === nama.toLowerCase());
    if (existing) {
      for (const cItem of state.lapakCart) {
        const it = existing.items.find(i => i.barang === cItem.barang);
        if (it) { it.riwayat += '+' + cItem.qty; it.qty += cItem.qty; }
        else { existing.items.push({ barang: cItem.barang, riwayat: String(cItem.qty), satuan: cItem.satuan, qty: cItem.qty, harga: 0 }); }
      }
      if (mode !== 'Nyenteng') {
        existing.totalTagihan += grandTotal;
        existing.bayarInput = existing.totalTagihan;
      }
    } else {
      state.nyentengList.unshift({
        id: 'PJM-0' + (state.nyentengList.length + 1),
        nama,
        tglAmbil: '15 Nov (Hari ini)',
        tipe: 'Nyenteng',
        items: state.lapakCart.map(cItem => ({ barang: cItem.barang, riwayat: String(cItem.qty), satuan: cItem.satuan, qty: cItem.qty, harga: 0 })),
        catatan: '',
        totalTagihan: mode === 'Nyenteng' ? 0 : grandTotal,
        sudahBayar: 0,
        bayarInput: mode === 'Nyenteng' ? 0 : grandTotal,
        metode: 'Tunai'
      });
    }
    toast('✓ Struk masuk ' + mode + ' (' + nama + ')!');
  }
  state.lapakCart = [];
  state.lapakBorrowerName = '';
  render();
}

  const nama = (state.lapakBorrowerName || '').trim() || (isNyenteng ? 'Pelanggan Nyenteng' : 'Peminjam Lapak');

function savePtDoc() {

  if (!f.ptName && !f.totalEkor) {

  }
  const totEk = Number(f.totalEkor || 0);
  const obEk = Number(f.obEkor || 0);
  const doaEk = Number(f.doa || 0);
  const tuOtomatis = Math.max(0, totEk - obEk - doaEk);
  const now = new Date();
  const jam = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ' WIB';
  const entry = {
    ptName: f.ptName || 'PT / Supplier',
    noDo: f.noDo || '-',
    lokasi: f.lokasi || '',
    armada: f.armada || 'FUSO',
    kepada: f.kepada || '',
    totalEkor: totEk,
    totalBerat: Number(f.totalBerat || 0),
    obEkor: obEk,
    tuEkor: tuOtomatis,
    doa: doaEk,
    fotoName: f.fotoName || '',
    fotoUrl: f.fotoUrl || '',
    jam
  };
  if (state.ptEditingIdx !== null) {
    const oldTu = Number(state.ptSavedList[state.ptEditingIdx].tuEkor || 0);
    state.ptTuEkor = state.ptTuEkor - oldTu + entry.tuEkor;
    state.ptSavedList[state.ptEditingIdx] = entry;
    state.ptEditingIdx = null;

    state.ptSavedList.unshift(entry);

}

function renderNav() {
  const nav = document.getElementById('bottomNav');
  if (state.role === 'login') {
    nav.style.display = 'none';
    return;
  }
  nav.style.display = 'flex';
  const menus = {
    owner: [
      { id: 'home', ico: ICO.home, lbl: 'Beranda' },
      { id: 'pt', ico: ICO.box, lbl: 'Masuk DO' },
      { id: 'kandang', ico: ICO.grid, lbl: 'Kandang' },
      { id: 'bon', ico: ICO.file, lbl: 'Input Bon' },
      { id: 'tagihan', ico: ICO.receipt, lbl: 'Keuangan' },
    ],
    admin: [
      { id: 'pt', ico: ICO.box, lbl: 'Masuk Barang' },
      { id: 'kandang', ico: ICO.grid, lbl: 'Kandang' },
      { id: 'bon', ico: ICO.file, lbl: 'Input Bon' },
    ],
    lapak: [
      { id: 'lapak', ico: ICO.store, lbl: 'Kasir Lapak' },
      { id: 'nyenteng', ico: ICO.clock, lbl: `Belum Bayar (${state.nyentengList.length + state.bonSavedList.filter(b => b.status === 'Belum Bayar').length})` },
      { id: 'pengeluaran', ico: ICO.wallet, lbl: 'Pengeluaran' },
    ]
  };
  const items = menus[state.role] || [];
  nav.innerHTML = items.map(m => `
    <button class="${state.tab === m.id ? 'active' : ''}" onclick="state.tab='${m.id}';render()">
      <span class="ico">${m.ico}</span>
      <span>${m.lbl}</span>
    </button>
  `).join('');
}

  // 4. KANDANG, ABSEN & STOK FREEZER/OPNAME
  if (state.tab === 'kandang') {
    const sisa = state.kandangAwal + state.ptTuEkor - state.kandangKeluar - state.kandangMati;
    c.innerHTML = `
      <h2>Kandang & Stok Freezer</h2>

      </div>
      ${state.kandangSubTab === 'keluar' ? `
        <div class="card">

          <input type="number" placeholder="0" value="${state.kdExpRp}" oninput="state.kdExpRp=this.value" />

        </div>
        <div class="card">
          <strong style="font-size:12.5px;display:block;margin-bottom:6px;">Riwayat Pengeluaran Kandang (${state.kandangPengeluaran.length})</strong>

            <div style="font-size:11.5px;padding:6px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">

      ` : state.kandangSubTab === 'freezer' ? `
        <div class="card">

            <span class="badge b-blue">${state.freezerStock.reduce((s,x)=>s+x.kgSistem,0).toFixed(1)} kg</span>

          <div class="row" style="margin-bottom:10px;">
            <button class="btn btn-soft" style="padding:7px;font-size:11px;border:1px solid var(--blue-border);" onclick="state.showSaldoAwalFreezer=!state.showSaldoAwalFreezer;state.showKeluarFreezer=false;render()">+ Saldo Awal</button>
            <button class="btn btn-red" style="padding:7px;font-size:11px;" onclick="state.showKeluarFreezer=!state.showKeluarFreezer;state.showSaldoAwalFreezer=false;render()">Keluar ke Lapak</button>
          </div>
          ${state.showSaldoAwalFreezer ? `
            <div style="background:var(--blue-soft);border:1px solid var(--blue-border);border-radius:10px;padding:10px;margin-bottom:10px;">

              <div class="row" style="margin-bottom:6px;">
                <select style="margin:0;background:#fff;" onchange="state.saldoAwalItem=this.value">
                  ${state.lapakItems.map(x => `<option value="${x.id}" ${state.saldoAwalItem===x.id?'selected':''}>${x.id}</option>`).join('')}

                <input type="number" placeholder="Ktg" value="${state.saldoAwalKtg}" oninput="state.saldoAwalKtg=this.value" style="flex:0 0 60px;margin:0;background:#fff;" />
                <input type="number" step="0.1" placeholder="Kg" value="${state.saldoAwalKg}" oninput="state.saldoAwalKg=this.value" style="flex:0 0 68px;margin:0;background:#fff;" />

        <div style="font-size:13px;font-weight:700;margin-bottom:8px;">Rekonsiliasi Stok Kandang (TU)</div>
        <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">Awal: ${state.kandangAwal} ekor + Masuk TU: ${state.ptTuEkor} ekor</div>
        <div id="matiLine" style="font-size:12px;color:var(--red);margin-bottom:10px;">Keluar TU: ${state.kandangKeluar} ekor − Mati Kandang: ${state.kandangMati} ekor</div>

          <button class="${state.stokShift==='Malam (Kahfi)'?'on':''}" onclick="state.stokShift='Malam (Kahfi)';render()">Malam (Kahfi)</button>

        </div>
        <div class="row" style="align-items:flex-end;">
          <div>
            <label>Jumlah Ayam Aktual (${state.stokShift})</label>

          <button class="btn btn-blue" style="flex:0 0 110px;" onclick="saveStokKandang(${sisa})">Simpan Stok</button>

        <div style="margin-top:10px;border-top:1px solid var(--border);padding-top:8px;">
          ${state.stokLog.slice(0,2).map(lg => `
            <div style="font-size:11.5px;display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
              <span><strong>${lg.shift}:</strong> ${lg.ekor} ekor <span style="color:var(--subtle)">(${lg.jam})</span></span>
              <span class="badge ${lg.status==='Sesuai'?'b-green':'b-amber'}">${lg.status}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="card">
        <div class="row" style="align-items:flex-end;">
          <div>
            <label>Mati di Kandang (ekor)</label>
            <input type="number" id="inMati" value="${state.kandangMati}" style="margin:0;" oninput="state.kandangMati=Number(this.value||0);document.getElementById('sisaVal').textContent=(state.kandangAwal+state.ptTuEkor-state.kandangKeluar-state.kandangMati)+' ekor';document.getElementById('matiLine').textContent='Keluar TU: '+state.kandangKeluar+' ekor − Mati Kandang: '+state.kandangMati+' ekor';" />
          </div>
          <button class="btn btn-red" style="flex:0 0 110px;" onclick="toast('Mati di kandang ('+state.kandangMati+' ekor) tersimpan!');render()">Simpan</button>
        </div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <strong style="font-size:13px;">Absen Pekerja Hari Ini</strong>
          <span class="badge b-green">${state.absenList.length} Hadir</span>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:11.5px;margin-bottom:10px;">
          <thead>
            <tr style="color:var(--muted);border-bottom:1px solid var(--border);text-align:left;">
              <th style="padding:4px 0;">No</th><th>Nama</th><th>Bagian</th><th>Jam</th><th></th>
            </tr>
          </thead>
          <tbody>
            ${state.absenList.map((ab, idx) => `
              <tr style="border-bottom:1px solid var(--border);">

        <div class="row" style="align-items:center;">

            <option value="Kandang" ${state.absenBagian==='Kandang'?'selected':''}>Kandang</option>
          </select>
          <button class="btn btn-blue" style="flex:0 0 54px;padding:9px;" onclick="addAbsen()">+</button>
        </div>
      </div>
      <div class="card">
        <strong style="font-size:13px;display:block;margin-bottom:8px;">Log Timbang Ulang WA (Al-Amin Barokah)</strong>
        <div style="font-size:12px;padding:6px 0;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;">
          <span>Nandi · 15 ekor (32,00 kg)</span><span class="badge b-green">Sudah Bon</span>
        </div>
        <div style="font-size:12px;padding:6px 0;display:flex;justify-content:space-between;">
          <span>Hj. Siti · 30 ekor (43,90 kg)</span><span class="badge b-amber">Belum Bon</span>
        </div>
      </div>
      `}
    `;
    return;
  }

  // 5. INPUT BON ADMIN (Gaya Rekap Jual - Al Amin: Shift + Chip Pedagang + Timbangan/Ekor/Harga + Ringkasan)
  if (state.tab === 'bon') {
    const filtered = state.pedagangList.filter(n => n.toLowerCase().includes(state.pedagangSearch.toLowerCase()));
    const kg = parseFloat(String(state.bonKg || '0').replace(',', '.')) || 0;
    const hg = Number(state.bonHarga || 0);
    const tot = Math.round(kg * hg);
    c.innerHTML = `
      <h2>Input Bon Keluar <span class="badge b-blue">Shift ${state.shift}</span></h2>
      <div class="seg">
        <button class="${state.shift==='MALAM'?'on':''}" onclick="state.shift='MALAM';render()">MALAM</button>
        <button class="${state.shift==='SIANG'?'on':''}" onclick="state.shift='SIANG';render()">SIANG</button>
      </div>
      <div class="card">
        <div class="row" style="margin-bottom:8px;align-items:center;">
          <input placeholder="Cari nama pembeli…" value="${state.pedagangSearch}" oninput="state.pedagangSearch=this.value;render()" style="margin:0;" />
          <button class="btn btn-soft" style="flex:0 0 92px;padding:9px 6px;font-size:11.5px;border:1px solid var(--blue-border);" onclick="state.showAddPedagang=!state.showAddPedagang;render()">+ Pembeli</button>
        </div>
        ${state.showAddPedagang ? `
          <div class="row" style="margin-bottom:8px;padding:8px;background:var(--blue-soft);border-radius:8px;border:1px solid var(--blue-border);">
            <input placeholder="Ketik nama pembeli baru..." value="${state.newPedagangName}" oninput="state.newPedagangName=this.value" style="margin:0;background:#fff;" onkeydown="if(event.key==='Enter'){addNewPedagang()}" />
            <button class="btn btn-blue" style="flex:0 0 74px;padding:9px;" onclick="addNewPedagang()">Simpan</button>
          </div>
        ` : ''}
        <div style="display:flex;flex-wrap:wrap;gap:5px;max-height:112px;overflow-y:auto;">
          ${filtered.map(n => {
            const done = state.pedagangDone.includes(n);
            const act = state.pedagangSelected === n;
            return `<button class="chip ${act?'on':''}" style="${done && !act ? 'background:var(--green-soft);color:var(--green);border-color:#BBF7D0;' : ''}" onclick="state.pedagangSelected='${n}';render()">${n}${done?'✓':''}</button>`;
          }).join('') || `<button class="chip on" onclick="state.newPedagangName=state.pedagangSearch;addNewPedagang()">+ Tambah "${state.pedagangSearch}"</button>`}
        </div>
      </div>
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
          <span style="font-size:13px;font-weight:800;color:var(--blue);">Pembeli: ${state.pedagangSelected}</span>
          <input type="date" value="${state.bonTanggal}" oninput="state.bonTanggal=this.value" style="width:auto;margin:0;padding:4px 8px;font-size:11.5px;" />
        </div>
        <div class="seg" style="margin-bottom:10px;">
          <button class="${state.bonJalur==='OB'?'on':''}" onclick="state.bonJalur='OB';render()">OB</button>
          <button class="${state.bonJalur==='TU'?'on':''}" onclick="state.bonJalur='TU';render()">TU</button>
        </div>
        <div class="row">
          <div><label>Ekor</label><input type="number" value="${state.bonEkor}" oninput="state.bonEkor=this.value" /></div>

        <input placeholder="mis: DG 33, Plet 8, ATI 40 · bon 2 lembar…" value="${state.bonNote}" oninput="state.bonNote=this.value" />
        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--blue-soft);border-radius:8px;margin-bottom:10px;">
          <span style="font-size:11.5px;font-weight:700;color:var(--blue);">Total Tagihan Bon:</span>

                const { b, idx } = g.rows[0];
                return `
                  <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;">
                    <div>
                      <strong>${b.pedagang}</strong>
                      <span class="badge ${b.jalur==='OB'?'b-blue':'b-green'}" style="padding:1px 6px;font-size:9.5px;margin-left:3px;">${b.jalur || 'TU'}</span>
                      <div style="font-size:11px;color:var(--muted);">${b.kg} kg · ${b.ekor} ekr · @${(b.harga/1000).toFixed(1).replace('.0','')}rb</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:6px;">
                      <strong>${rp(b.total)}</strong>
                      <button style="border:1px solid #FDE68A;background:var(--amber-soft);color:var(--amber);border-radius:999px;width:22px;height:22px;font-size:11px;cursor:pointer;" onclick="editBonRow(${idx})">✎</button>
                      <button style="border:1px solid var(--border);background:var(--bg);color:var(--muted);border-radius:999px;width:22px;height:22px;font-size:11px;cursor:pointer;" onclick="batalBonRow(${idx})">✕</button>
                    </div>
                  </div>
                `;
              })()}
            </div>
          `).join('');
        })()}
      </div>
    `;
    return;
  }

  // 6. KASIR LAPAK — GAYA POS KASIR MINIMARKET (Multi-item Struk + 1-Tap Bayar / Pinjem / Nyenteng)
  if (state.tab === 'lapak') {
    const curItem = state.lapakItems.find(x => x.id === state.lapakItemName) || state.lapakItems[0];
    const grandTotal = state.lapakCart.reduce((s, it) => s + it.total, 0);
    c.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <span style="font-size:16px;font-weight:800;">Kasir Lapak (POS)</span>
        <span style="font-size:11px;font-weight:700;color:var(--blue);">Modal Laci: 500rb</span>
      </div>

      <div class="seg" style="margin-bottom:10px;">
        <button class="${state.lapakSubTab==='pos'?'on':''}" onclick="state.lapakSubTab='pos';render()">Penjualan</button>
        <button class="${state.lapakSubTab==='parting'?'on':''}" onclick="state.lapakSubTab='parting';render()">Stok</button>
      </div>

      ${state.lapakSubTab === 'parting' ? `
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;">
          ${state.lapakItems.map(it => {
            const on = state.partingItem === it.id;
            return `
              <button onclick="state.partingItem='${it.id}';render()" style="padding:10px 4px;border-radius:10px;border:1.5px solid ${on?'var(--blue)':'var(--border)'};background:${on?'var(--blue-soft)':'#fff'};cursor:pointer;text-align:center;">
                <div style="font-size:12px;font-weight:800;color:${on?'var(--blue)':'var(--text)'};">${it.short}</div>
              </button>
            `;
          }).join('')}
          <button onclick="state.showAddItem=!state.showAddItem;render()" style="padding:10px 4px;border-radius:10px;border:1.5px dashed var(--blue);background:var(--blue-soft);cursor:pointer;text-align:center;">
            <div style="font-size:11.5px;font-weight:800;color:var(--blue);">+ Item</div>
          </button>
        </div>

        ${state.showAddItem ? `
          <div class="card" style="padding:10px;margin-bottom:8px;border-color:var(--blue-border);background:var(--blue-soft);">
            <div class="row" style="align-items:center;">
              <input placeholder="Nama item baru (mis: Uritan)" value="${state.newItemName}" oninput="state.newItemName=this.value" style="margin:0;background:#fff;" />
              <select style="flex:0 0 70px;margin:0;background:#fff;" onchange="state.newItemSat=this.value">
                <option value="kg" ${state.newItemSat==='kg'?'selected':''}>kg</option>
                <option value="pcs" ${state.newItemSat==='pcs'?'selected':''}>pcs</option>
              </select>
              <button class="btn btn-blue" style="flex:0 0 70px;padding:9px;" onclick="addNewLapakItem();state.partingItem=state.lapakItemName;render()">Simpan</button>
            </div>
          </div>
        ` : ''}

        <div class="card" style="padding:10px 12px;margin-bottom:10px;">
          <div class="row" style="align-items:flex-end;">
            <div style="flex:0.9">
              <label>Kantong</label>
              <input type="number" placeholder="0" value="${state.partingKtg}" oninput="state.partingKtg=this.value" style="margin:0;padding:8px;font-size:13.5px;font-weight:800;" />
            </div>
            <div style="flex:0.9">
              <label>Berat (kg)</label>
              <input type="number" step="0.1" placeholder="0.0" value="${state.partingKg}" oninput="state.partingKg=this.value" style="margin:0;padding:8px;font-size:13.5px;font-weight:800;" />
            </div>
            <button class="btn btn-blue" style="flex:0 0 92px;padding:9px 6px;font-size:12px;" onclick="addPartingCart()">+ List</button>
          </div>
        </div>

        <div class="card" style="padding:10px 12px;margin-bottom:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
            <strong style="font-size:12.5px;">List Barang Stok (${state.partingCart.length} item)</strong>
            ${state.partingCart.length ? `<button style="border:0;background:transparent;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;" onclick="state.partingCart=[];render()">Kosongkan</button>` : ''}
          </div>
          ${state.partingCart.map((pt, idx) => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--border);font-size:12px;">
              <strong>${pt.item}</strong>
              <div style="display:flex;align-items:center;gap:10px;">
                <span>${pt.ktg} ktg · <strong>${pt.kg} kg</strong></span>
                <button style="border:0;background:transparent;color:var(--red);font-weight:700;cursor:pointer;" onclick="state.partingCart.splice(${idx},1);render()">✕</button>
              </div>
            </div>
          `).join('') || '<div style="font-size:11.5px;color:var(--muted);padding:6px 0;">Pilih barang, isi kantong & kg, lalu klik + List.</div>'}
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;">
            <button class="btn btn-blue" style="padding:11px 6px;font-size:11.5px;" onclick="savePartingCart('masuk')">Masuk Freezer (+)</button>
            <button class="btn btn-red" style="padding:11px 6px;font-size:11.5px;" onclick="savePartingCart('keluar')">Keluar Stok (−)</button>
          </div>
        </div>

        <div class="card" style="padding:10px 12px;">
          <strong style="font-size:12.5px;display:block;margin-bottom:6px;">Catatan Stok Hari Ini (${state.partingTodayLog.length})</strong>
          ${state.partingTodayLog.map(p => `
            <div style="font-size:11.5px;padding:5px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
              <div>
                <strong>${p.item}</strong>: ${p.ktg} ktg (${p.kg} kg)
                <span style="color:var(--subtle);font-size:10px;"> · ${p.jam}</span>
              </div>
              <span class="badge ${p.arah==='keluar'?'b-red':'b-blue'}">${p.arah==='keluar'?'Keluar (−)':'Masuk (+)'}</span>
            </div>
          `).join('') || '<div style="font-size:11px;color:var(--muted);">Belum ada catatan masuk/keluar stok hari ini.</div>'}
        </div>
      ` : `

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px;">
        ${state.lapakItems.map(it => {
          const on = state.lapakItemName === it.id;
          return `
            <button onclick="state.lapakItemName='${it.id}';render()" style="padding:10px 4px;border-radius:10px;border:1.5px solid ${on?'var(--blue)':'var(--border)'};background:${on?'var(--blue-soft)':'#fff'};cursor:pointer;text-align:center;">
              <div style="font-size:12px;font-weight:800;color:${on?'var(--blue)':'var(--text)'};">${it.short}</div>
            </button>
          `;
        }).join('')}
        <button onclick="state.showAddItem=!state.showAddItem;render()" style="padding:10px 4px;border-radius:10px;border:1.5px dashed var(--blue);background:var(--blue-soft);cursor:pointer;text-align:center;">
          <div style="font-size:11.5px;font-weight:800;color:var(--blue);">+ Item</div>
        </button>
      </div>

      ${state.showAddItem ? `
        <div class="card" style="padding:10px;margin-bottom:8px;border-color:var(--blue-border);background:var(--blue-soft);">
          <div class="row" style="align-items:center;">
            <input placeholder="Nama item baru (mis: Uritan)" value="${state.newItemName}" oninput="state.newItemName=this.value" style="margin:0;background:#fff;" />
            <select style="flex:0 0 70px;margin:0;background:#fff;" onchange="state.newItemSat=this.value">
              <option value="kg" ${state.newItemSat==='kg'?'selected':''}>kg</option>
              <option value="pcs" ${state.newItemSat==='pcs'?'selected':''}>pcs</option>
            </select>
            <button class="btn btn-blue" style="flex:0 0 70px;padding:9px;" onclick="addNewLapakItem()">Simpan</button>
          </div>
        </div>
      ` : ''}

      <div class="card" style="padding:10px 12px;margin-bottom:10px;">
        <div class="row" style="align-items:flex-end;">
          <div style="flex:0.8">
            <label>Qty (${curItem.sat})</label>
            <input type="number" step="0.1" value="${state.lapakKg}" oninput="state.lapakKg=Number(this.value||0)" style="margin:0;padding:8px;font-size:13.5px;font-weight:800;" />
          </div>
          <div style="flex:1">
            <label>Harga/${curItem.sat} (Rp)</label>
            <input type="number" value="${state.lapakHarga}" oninput="state.lapakHarga=Number(this.value||0)" style="margin:0;padding:8px;font-size:13px;" />
          </div>
          <button class="btn btn-blue" style="flex:0 0 92px;padding:9px 6px;font-size:12px;" onclick="addToPosCart()">+ Struk</button>
        </div>
      </div>

      <div class="card" style="padding:10px 12px;margin-bottom:10px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <strong style="font-size:12.5px;">Struk Belanja (${state.lapakCart.length} item)</strong>
          ${state.lapakCart.length ? `<button style="border:0;background:transparent;color:var(--red);font-size:11px;font-weight:700;cursor:pointer;" onclick="state.lapakCart=[];render()">Kosongkan</button>` : ''}
        </div>
        ${state.lapakCart.map((it, idx) => `
          <div style="display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-top:1px solid var(--border);font-size:12px;">
            <div>
              <strong>${it.barang}</strong>
              <div style="font-size:10.5px;color:var(--muted);">${it.qty} ${it.satuan} × ${rp(it.harga)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <strong>${rp(it.total)}</strong>
              <button style="border:0;background:transparent;color:var(--red);font-weight:700;cursor:pointer;" onclick="state.lapakCart.splice(${idx},1);render()">✕</button>
            </div>
          </div>
        `).join('') || '<div style="font-size:11.5px;color:var(--muted);padding:6px 0;">Struk masih kosong. Pilih barang & klik + Struk.</div>'}
        <div style="border-top:1.5px dashed var(--border);margin-top:6px;padding-top:8px;">
          <input placeholder="Nama Pembeli (opsional untuk Lunas, wajib utk Pinjem)" value="${state.lapakBorrowerName}" oninput="state.lapakBorrowerName=this.value" style="margin-bottom:8px;padding:7px 10px;font-size:12px;" />
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <span style="font-size:12px;font-weight:700;color:var(--muted);">TOTAL STRUK:</span>
            <strong style="font-size:18px;color:var(--navy);">${rp(grandTotal)}</strong>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;">
        <button class="btn btn-green" style="padding:13px 6px;font-size:13px;" onclick="checkoutPos('Lunas')">Bayar Lunas</button>
        <button class="btn btn-amber" style="padding:13px 6px;font-size:13px;" onclick="checkoutPos('Nyenteng')">Nyenteng</button>
      </div>

      <div class="card" style="padding:10px 12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
          <strong style="font-size:12.5px;">Histori Transaksi Kasir (${state.lapakHistory.length})</strong>
          <span style="font-size:11px;color:var(--green);font-weight:700;">Masuk: ${rp(state.uangMasukPelunasan)}</span>
        </div>
        ${state.lapakHistory.map(h => `
          <div style="font-size:11.5px;padding:6px 0;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;">
            <div>
              <strong>${h.nama}</strong> <span style="color:var(--subtle);font-size:10px;">(${h.jam})</span>
              <div style="font-size:10.5px;color:var(--muted);">${h.detail}${h.total > 0 ? ' · <strong style="color:var(--navy)">'+rp(h.total)+'</strong>' : ''}</div>
            </div>
            <span class="badge ${h.status==='Lunas'?'b-green':(h.status==='Pinjem'?'b-amber':'b-blue')}">${h.status}</span>
          </div>
        `).join('')}
      </div>
      `}
    `;
    return;
  }

  // 7. BELUM BAYAR (BON KANDANG + NYENTENG LAPAK) — PAK ASEP / KASIR LAPAK
  if (state.tab === 'nyenteng') {
    const belumBons = state.bonSavedList.map((b, i) => ({ b, i })).filter(x => x.b.status === 'Belum Bayar');
    c.innerHTML = `
      <h2>Belum Bayar & Pelunasan</h2>
      <div class="card" style="background:var(--navy);color:#fff;padding:10px 14px;margin-bottom:10px;">
        <div style="font-size:11px;color:var(--subtle);">Total Uang Masuk Pelunasan Hari Ini:</div>
        <div style="font-size:17px;font-weight:800;color:#4ADE80;margin-top:2px;">${rp(state.uangMasukPelunasan)}</div>
      </div>

      <div class="seg">
        <button class="${state.belumBayarSubTab==='bon'?'on':''}" onclick="state.belumBayarSubTab='bon';render()">📦 Bon Kandang (${belumBons.length})</button>
        <button class="${state.belumBayarSubTab==='nyenteng'?'on':''}" onclick="state.belumBayarSubTab='nyenteng';render()">⏳ Nyenteng Lapak (${state.nyentengList.length})</button>
      </div>

      ${state.belumBayarSubTab === 'bon' ? (
        belumBons.map(({ b, i }) => {
          const sudah = Number(b.sudahBayar || 0);
          const sisaTagihan = Math.max(0, b.total - sudah);
          const bayar = Number(b.bayarInput || 0);
          const selisih = Math.max(0, sisaTagihan - bayar);
          const isPartial = bayar > 0 && bayar < sisaTagihan;
          return `
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <strong style="font-size:13.5px;">${b.id} · ${b.pedagang}</strong>
                <span class="badge b-blue">1 Bon = 1 Tagihan</span>
              </div>
              <div style="font-size:11.5px;color:var(--muted);margin-bottom:6px;">${b.tgl} (${b.shift}) · ${b.kg} kg · ${b.ekor} ekor</div>
              <div style="font-size:12px;margin-bottom:8px;">
                <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);">Total Tagihan Bon:</span><strong>${rp(b.total)}</strong></div>
                ${sudah > 0 ? `
                  <div style="display:flex;justify-content:space-between;color:var(--green);"><span>Sudah Dibayar:</span><strong>− ${rp(sudah)}</strong></div>
                  <div style="display:flex;justify-content:space-between;color:var(--red);font-size:13px;"><span>Sisa Tagihan:</span><strong>${rp(sisaTagihan)}</strong></div>
                ` : ''}
              </div>
              <div class="row">
                <div>
                  <label>Uang Masuk (Rp)</label>
                  <input type="number" value="${b.bayarInput}" onchange="state.bonSavedList[${i}].bayarInput=Number(this.value||0);render()" />
                </div>
                <div style="flex:0 0 105px;">
                  <label>Metode</label>
                  <select onchange="state.bonSavedList[${i}].metode=this.value">
                    <option value="Tunai" ${b.metode==='Tunai'?'selected':''}>Tunai</option>
                    <option value="Transfer" ${b.metode==='Transfer'?'selected':''}>Transfer</option>
                  </select>
                </div>
              </div>
              ${isPartial ? `
                <button class="btn btn-blue" style="margin-bottom:6px;" onclick="cicilBon(${i})">Bayar Sebagian (${rp(bayar)})</button>
                <button class="btn btn-amber" style="padding:8px;font-size:11px;" onclick="lunasiBon(${i})">Atau Anggap Lunas + Diskon Owner ${rp(selisih)}</button>
              ` : `
                <button class="btn btn-green" onclick="lunasiBon(${i})">✓ Lunasi (${b.metode}) · ${rp(bayar)}</button>
              `}
            </div>
          `;
        }).join('') || '<div class="card">Semua bon kandang sudah lunas!</div>'
      ) : (
        state.nyentengList.map((n, idx) => {
        const calcTot = n.items.reduce((s, it) => s + Math.round(it.qty * Number(it.harga || 0)), 0);
        n.totalTagihan = calcTot;
        const sudah = Number(n.sudahBayar || 0);
        const sisaTagihan = Math.max(0, calcTot - sudah);
        const bayar = Number(n.bayarInput || 0);
        const selisihNy = Math.max(0, sisaTagihan - bayar);
        const isPartial = calcTot > 0 && bayar > 0 && bayar < sisaTagihan;
        return `
          <div class="card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
              <div>
                <strong style="font-size:13.5px;">${n.nama}</strong>
                <div style="font-size:10px;color:${(n.tglAmbil||'').includes('Kemarin')?'var(--red)':'var(--muted)'};font-weight:700;">Ambil: ${n.tglAmbil || '15 Nov (Hari ini)'}</div>
              </div>
              <span class="badge b-amber">${n.tipe}</span>
            </div>
            <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:11.5px;">
              ${n.items.map((it, iIdx) => `
                <div style="display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;${iIdx>0?'border-top:1px solid var(--border);':''}">
                  <div style="flex:1;">
                    <strong>${it.barang}</strong>: ${it.riwayat} ${it.satuan}
                    <div style="font-size:10px;color:var(--muted);">Total: ${it.qty} ${it.satuan} · ${rp(it.qty * Number(it.harga || 0))}</div>
                  </div>
                  <div style="flex:0 0 92px;">
                    <input type="number" placeholder="Harga/${it.satuan}" value="${it.harga || ''}" style="margin:0;padding:5px 7px;font-size:11.5px;background:#fff;" onchange="updateNyItemHarga(${idx},${iIdx},this.value)" />
                  </div>
                </div>
              `).join('')}
              ${n.catatan ? `<div style="font-size:11px;color:var(--blue);margin-top:4px;">Ket: ${n.catatan}</div>` : ''}
            </div>
            <div style="font-size:12px;margin-bottom:8px;">
              <div style="display:flex;justify-content:space-between;">
                <span style="color:var(--muted);">Total Tagihan:</span>
                <strong>${rp(calcTot)}</strong>
              </div>
              ${sudah > 0 ? `
                <div style="display:flex;justify-content:space-between;color:var(--green);margin-top:2px;">
                  <span>Sudah Dibayar / Cicil:</span>
                  <strong>− ${rp(sudah)}</strong>
                </div>
                <div style="display:flex;justify-content:space-between;color:var(--red);margin-top:2px;font-size:13px;">
                  <span>Sisa Tagihan:</span>
                  <strong>${rp(sisaTagihan)}</strong>
                </div>
              ` : ''}
            </div>
            <div class="row">
              <div>
                <label>Uang Masuk (Rp)</label>
                <input type="number" value="${n.bayarInput}" onchange="state.nyentengList[${idx}].bayarInput=Number(this.value||0);render()" />
              </div>
              <div style="flex:0 0 100px;">
                <label>Metode</label>
                <select onchange="state.nyentengList[${idx}].metode=this.value">
                  <option value="Tunai" ${n.metode==='Tunai'?'selected':''}>Tunai</option>
                  <option value="Transfer" ${n.metode==='Transfer'?'selected':''}>Transfer</option>
                </select>
              </div>
            </div>
            <div class="row" style="margin-bottom:${isPartial?'6px':'0'};">
              <button class="btn btn-soft" style="flex:0 0 104px;font-size:11.5px;" onclick="state.lapakBorrowerName='${n.nama}';state.tab='lapak';render()">+ Ambil Lagi</button>
              ${isPartial ? `
                <button class="btn btn-blue" onclick="cicilNyenteng(${idx})">Bayar Sebagian (${rp(bayar)})</button>
              ` : `
                <button class="btn btn-green" onclick="lunasiNyenteng(${idx})">✓ Lunasi (${n.metode}) · ${rp(bayar)}</button>
              `}
            </div>
            ${isPartial ? `
              <button class="btn btn-amber" style="padding:8px;font-size:11px;" onclick="lunasiNyenteng(${idx})">
                Atau Anggap Lunas + Diskon Owner ${rp(selisihNy)}
              </button>
            ` : ''}
          </div>
        `;
      }).join('') || '<div class="card">Semua transaksi nyenteng sudah lunas!</div>'
      )}
    `;
    return;
  }

  // 8. PENGELUARAN LAPAK
  if (state.tab === 'pengeluaran') {
    c.innerHTML = `
      <h2>Pengeluaran Lapak</h2>
      ${state.pengeluaran.map(p => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;">
            <strong style="font-size:13px;">${p.no} · ${p.ket}</strong>
            <span class="badge ${p.st==='Disetujui'?'b-green':'b-amber'}">${p.st}</span>
          </div>
          <div style="font-size:11px;color:var(--muted);margin:4px 0;">${p.jam} · Dibayar dari: ${p.sumber}</div>
          <div style="font-size:14px;font-weight:800;color:var(--red);">${rp(p.rp)}</div>
        </div>
      `).join('')}
      <div class="card">
        <label>Keperluan Baru</label><input id="expKet" placeholder="Contoh: Beli Es Batu" />
        <label>Nominal (Rp)</label><input id="expRp" type="number" value="35000" />
        <button class="btn btn-blue" onclick="state.pengeluaran.unshift({no:'#0'+(16+state.pengeluaran.length),ket:document.getElementById('expKet').value||'Operasional Lapak',jam:'Baru saja',sumber:'Kas Lapak',rp:Number(document.getElementById('expRp').value||0),st:'Menunggu'});toast('Pengeluaran + Foto Nota tersimpan!');render()">+ Simpan Pengeluaran</button>
      </div>
    `;
    return;
  }

  // 9. KEUANGAN OWNER (PENAGIHAN BON + NYENTENG + DISKON + HUTANG PT)
  if (state.tab === 'tagihan') {
    const belumBons = state.bonSavedList.map((b, i) => ({ b, i })).filter(x => x.b.status === 'Belum Bayar');
    c.innerHTML = `
      <h2>Keuangan & Penagihan Owner</h2>
      <div class="seg">
        <button class="${state.tagihanSubTab==='bon'?'on':''}" onclick="state.tagihanSubTab='bon';render()">Tagih Bon (${belumBons.length})</button>
        <button class="${state.tagihanSubTab==='pt'?'on':''}" onclick="state.tagihanSubTab='pt';render()">Tagihan Supplier & Diskon</button>
      </div>

      ${state.tagihanSubTab === 'bon' ? `
        <div class="card" style="background:var(--navy);color:#fff;padding:10px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:11px;color:var(--subtle);">Uang Masuk Penagihan:</span>
          <strong style="font-size:16px;color:#4ADE80;">${rp(state.uangMasukPelunasan)}</strong>
        </div>
        <input placeholder="Cari nama pembeli atau no. bon..." value="${state.ownerTagihSearch}" oninput="state.ownerTagihSearch=this.value;render()" style="background:#fff;margin-bottom:10px;" />
        ${belumBons.filter(({b}) => (b.pedagang + ' ' + b.id).toLowerCase().includes(state.ownerTagihSearch.toLowerCase())).map(({ b, i }) => {
          const sudah = Number(b.sudahBayar || 0);
          const sisaTagihan = Math.max(0, b.total - sudah);
          const bayar = Number(b.bayarInput || 0);
          const selisih = Math.max(0, sisaTagihan - bayar);
          const isPartial = bayar > 0 && bayar < sisaTagihan;
          const open = state.ownerExpandedBonId === b.id;
          return `
            <div class="card" style="padding:10px 12px;margin-bottom:8px;">
              <div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;" onclick="state.ownerExpandedBonId=state.ownerExpandedBonId==='${b.id}'?null:'${b.id}';render()">
                <div>
                  <strong style="font-size:13px;">${b.id} · ${b.pedagang}</strong>
                  <div style="font-size:10.5px;color:var(--muted);">${b.tgl} · ${b.kg} kg · ${b.ekor} ekor</div>
                </div>
                <div style="text-align:right;display:flex;align-items:center;gap:8px;">
                  <div>
                    <div style="font-size:12.5px;font-weight:800;color:var(--red);">${rp(sisaTagihan)}</div>
                    ${sudah > 0 ? `<div style="font-size:9.5px;color:var(--green);">Cicil: ${rp(sudah)}</div>` : ''}
                  </div>
                  <span class="badge ${open?'b-blue':'b-gray'}">${open?'Tutup ▴':'Tagih ▾'}</span>
                </div>
              </div>
              ${open ? `
                <div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">
                  <div class="row">
                    <div>
                      <label>Uang Masuk (Rp)</label>
                      <input type="number" value="${b.bayarInput}" onchange="state.bonSavedList[${i}].bayarInput=Number(this.value||0);render()" />
                    </div>
                    <div style="flex:0 0 100px;">
                      <label>Metode</label>
                      <select onchange="state.bonSavedList[${i}].metode=this.value">
                        <option value="Tunai" ${b.metode==='Tunai'?'selected':''}>Tunai</option>
                        <option value="Transfer" ${b.metode==='Transfer'?'selected':''}>Transfer</option>
                      </select>
                    </div>
                  </div>
                  ${isPartial ? `
                    <button class="btn btn-blue" style="margin-bottom:6px;padding:9px;font-size:12px;" onclick="cicilBon(${i})">Bayar Sebagian (${rp(bayar)})</button>
                    <button class="btn btn-amber" style="padding:7px;font-size:11px;" onclick="lunasiBon(${i})">Anggap Lunas + Diskon ${rp(selisih)}</button>
                  ` : `
                    <button class="btn btn-green" style="padding:9px;font-size:12px;" onclick="lunasiBon(${i})">✓ Lunasi (${b.metode}) · ${rp(bayar)}</button>
                  `}
                </div>
              ` : ''}
            </div>
          `;
        }).join('') || '<div class="card">Tidak ada bon yang cocok / semua sudah lunas!</div>'}
      ` : `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
            <strong style="font-size:13px;">Input Harga Beli DO (Owner)</strong>
            <input type="date" value="${state.ptBeliTanggal}" onchange="state.ptBeliTanggal=this.value;render()" style="width:auto;margin:0;padding:4px 8px;font-size:11.5px;" />
          </div>
          <div class="row">
            <div>
              <label>DO 1 · FUSO (${state.ptKgFuso.toLocaleString('id-ID')} kg)</label>
              <input type="number" id="inFusoKeu" value="${state.ptModalFuso}" style="margin-bottom:6px;" />
            </div>
            <div>
              <label>DO 2 · L300 (${state.ptKgL300.toLocaleString('id-ID')} kg)</label>
              <input type="number" id="inL300Keu" value="${state.ptModalL300}" style="margin-bottom:6px;" />
            </div>
          </div>
          <button class="btn btn-blue" style="padding:9px;font-size:12px;" onclick="saveHargaBeliPt()">Simpan Pembelian (${state.ptBeliTanggal})</button>
        </div>
        <div class="card">
          <div style="font-size:12.5px;font-weight:700;">Total Diskon / Cashback Diberikan</div>
          <div style="font-size:14px;font-weight:800;color:var(--amber);margin-top:4px;">${rp(state.totalDiskonBulan)} (dari ${state.totalBonDiskon} bon)</div>
        </div>
        <strong style="font-size:13px;display:block;margin:10px 0 8px;">Rekap Tagihan Supplier per Tanggal</strong>
        ${state.ptPurchaseHistory.map((ph, idx) => {
          const sudah = Number(ph.sudahBayar || 0);
          const sisaSup = Math.max(0, ph.total - sudah);
          const inp = Number(ph.bayarInput || 0);
          const stBadge = ph.lunas ? ['b-green', 'Lunas ke Supplier'] : (sudah > 0 ? ['b-amber', 'Cicil / Pending'] : ['b-red', 'Belum Bayar']);
          return `
            <div class="card">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;">
                <strong style="font-size:13px;">${ph.tgl}</strong>
                <span class="badge ${stBadge[0]}">${stBadge[1]}</span>
              </div>
              <div style="font-size:11.5px;color:var(--muted);">• FUSO (${ph.fusoKg.toLocaleString('id-ID')} kg × ${rp(ph.fusoHarga)}): <strong>${rp(ph.fusoKg * ph.fusoHarga)}</strong></div>
              <div style="font-size:11.5px;color:var(--muted);margin-top:2px;">• L300 (${ph.l300Kg.toLocaleString('id-ID')} kg × ${rp(ph.l300Harga)}): <strong>${rp(ph.l300Kg * ph.l300Harga)}</strong></div>
              <div style="font-size:12px;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);">
                <div style="display:flex;justify-content:space-between;"><span style="color:var(--muted);">Total Tagihan:</span><strong>${rp(ph.total)}</strong></div>
                ${!ph.lunas ? `
                  <div style="display:flex;justify-content:space-between;color:var(--green);margin-top:2px;"><span>Sudah Dibayar:</span><strong>${rp(sudah)}</strong></div>
                  <div style="display:flex;justify-content:space-between;color:var(--red);margin-top:2px;font-size:13px;"><span>Sisa Pending:</span><strong>${rp(sisaSup)}</strong></div>
                ` : ''}
              </div>
              ${!ph.lunas ? `
                <div class="row" style="margin-top:8px;align-items:flex-end;">
                  <div>
                    <label>Bayar ke Supplier (Rp)</label>
                    <input type="number" value="${ph.bayarInput}" style="margin:0;" onchange="state.ptPurchaseHistory[${idx}].bayarInput=Number(this.value||0);render()" />
                  </div>
                  <button class="btn ${inp < sisaSup ? 'btn-blue' : 'btn-green'}" style="flex:0 0 132px;padding:9px 8px;font-size:11.5px;" onclick="bayarSupplier(${idx})">
                    ${inp < sisaSup ? 'Bayar Sebagian' : '✓ Lunasi'}
                  </button>
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      `}
    `;
  }
}

render();
</script>
</body>
</html>
